name: Sync Upstream Main
on:
  schedule:
    - cron: '0 */6 * * *' # UTC时区，每6小时执行一次
  workflow_dispatch: # 页面上出现【Run workflow】手动触发按钮

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync upstream main to company main
        uses: repo-sync/github-sync@v2
        with:
          source_repo: "https://github.com/tonycc/ai-hub.git" # 👉这里替换成公开上游仓库，例如 octocat/hello-world.git
          source_branch: "main"
          destination_branch: "main"
          github_token: ${{ secrets.REPO_SYNC_PAT }}
