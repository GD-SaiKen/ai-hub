name: Sync Upstream Main
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.REPO_SYNC_PAT }}

      - name: Sync upstream using raw git
        env:
          PAT: ${{ secrets.REPO_SYNC_PAT }}
        run: |
          git config --global user.name "GD-SaiKen"
          git config --global user.email "xxx@xxx.com"

          # 添加上游仓库
          git remote add upstream https://github.com/tonycc/ai-hub.git
          git fetch upstream main

          # 合并上游main到本地main
          git checkout main
          git merge upstream/main --allow-unrelated-histories

          # 推送回当前仓库，URL内置PAT，保证鉴权生效
          git push https://${PAT}@github.com/GD-SaiKen/ai-hub.git main
